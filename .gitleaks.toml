title = "ProofStack reviewed non-secret exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Supabase documents this exact prefix as public routing configuration, never
# the privileged sb_secret_ format. Default detectors remain enabled elsewhere.
[[rules.allowlists]]
description = "Public Supabase publishable-key format only"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]+$''']

# RFC6238's published SHA1 test vector is permitted only in its explicit test.
# A matching seed in application/configuration code must still be detected.
[[rules.allowlists]]
description = "Exact published RFC6238 fixture, not user factor material"
condition = "AND"
paths = ['''(^|[/\\])tests[/\\]totp-authenticator\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const secret = "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ";\s*$''']

[[rules.allowlists]]
description = "Exact historical review sentence misdetected as an API key"
condition = "AND"
paths = ['''(^|[/\\])docs[/\\]review-phase5-2026-10-06\.md$''']
regexTarget = "match"
regexes = ['''^API proxy responses, anonymous/private\s*$''']

# Commit ad2899d test fixtures: a UUID object id named `key` and a disposable
# session value. Both lines were since rewritten; these match only the exact
# historical lines in their test files.
[[rules.allowlists]]
description = "Historical UUID fixture in community asset tests"
condition = "AND"
paths = ['''(^|[/\\])tests[/\\]community-assets\.test\.ts$''']
regexTarget = "line"
regexes = ['''^const key = "cc1575d2-514f-42fb-97b4-f6b6b7503a77";\s*$''']

[[rules.allowlists]]
description = "Historical disposable session value in upload route tests"
condition = "AND"
paths = ['''(^|[/\\])tests[/\\]asset-upload-route\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*vi\.stubEnv\("SESSION_SECRET", "disposable-route-test-key-at-least-32-chars"\);\s*$''']

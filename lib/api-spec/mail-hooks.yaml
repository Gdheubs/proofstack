openapi: 3.1.0
info: { title: Mail hooks, version: 1.0.0 }
paths:
  /platform/hooks/mail:
    post:
      operationId: receiveMailHook
      description: Raw signed delivery reports from the configured mail sender.
      requestBody:
        required: true
        content:
          application/json:
            { schema: { type: object, additionalProperties: true } }
      responses:
        "202": { description: Receipt accepted }
        default: { description: Unavailable or invalid hook }

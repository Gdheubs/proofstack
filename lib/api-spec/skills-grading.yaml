openapi: 3.1.0
info: { title: Skills grading, version: 1.0.0 }
paths:
  /skills/grading:
    get:
      operationId: getSkillsGrading
      parameters:
        - {
            name: view,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    queues,
                    task,
                    calibration,
                    appeals,
                    appeal,
                    cases,
                    case,
                    rulings,
                    stats,
                  ],
              },
          }
        - { name: id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Grading workspace data,
            content:
              {
                application/json:
                  { schema: { type: object, additionalProperties: true } },
              },
          }
        default: { description: Unavailable or not authorized }
  /skills/grading/action:
    post:
      operationId: runSkillsGradingAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: claim-next } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: release } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: declare-conflict } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: identity-revealed } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: grade-submit } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: calibration-start } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: calibration-submit } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: adjudicate } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: appeal-assign } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: appeal-decide } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: integrity-decide } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: incident-grant } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: resume-grant } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: ruling-apply } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: support-view } },
                    additionalProperties: true,
                  }
              discriminator: { propertyName: action }
      responses:
        "200":
          {
            description: Grading action accepted,
            content:
              {
                application/json:
                  { schema: { type: object, additionalProperties: true } },
              },
          }
        default: { description: Unavailable or not authorized }

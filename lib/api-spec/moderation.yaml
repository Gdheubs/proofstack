openapi: 3.1.0
info: { title: Moderation, version: 1.0.0 }
paths:
  /moderation:
    get:
      operationId: getModeration
      parameters:
        - {
            name: view,
            in: query,
            required: true,
            schema: { type: string, enum: [queue, report] },
          }
        - { name: id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Moderation data,
            content:
              {
                application/json:
                  { schema: { type: object, additionalProperties: true } },
              },
          }
        default: { description: Unavailable or not authorized }
  /moderation/action:
    post:
      operationId: runModerationAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: report } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: triage } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: restrict } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: lift } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: suspend } },
                    additionalProperties: true,
                  }
              discriminator: { propertyName: action }
      responses:
        "200":
          {
            description: Moderation action accepted,
            content:
              {
                application/json:
                  { schema: { type: object, additionalProperties: true } },
              },
          }
        default: { description: Unavailable or not authorized }

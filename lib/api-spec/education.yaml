openapi: 3.1.0
info: { title: Education, version: 1.0.0 }
paths:
  /education:
    get:
      operationId: getEducation
      parameters:
        - {
            name: view,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    cohorts,
                    cohort,
                    roster,
                    assignments,
                    assignment,
                    sittings,
                    sitting,
                    my,
                    invite,
                  ],
              },
          }
        - { name: id, in: query, schema: { type: string, format: uuid } }
        - { name: token, in: query, schema: { type: string } }
      responses:
        "200":
          {
            description: Education workspace data,
            content:
              {
                application/json:
                  { schema: { type: object, additionalProperties: true } },
              },
          }
        default: { description: Unavailable or not authorized }
  /education/action:
    post:
      operationId: runEducationAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: cohort-save } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: cohort-archive } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: join-code-rotate } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: enrollment-approve } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: enrollment-remove } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: invite-resend } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: enrollment-import } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: enrollment-accept } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: join-cohort } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: enrollment-leave } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: assignment-save } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: assignment-open } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: assignment-extend } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: assignment-cancel } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: release-results } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: accommodation-request } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: accommodation-approve } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: sitting-save } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: sitting-admit } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: sitting-incident } },
                    additionalProperties: true,
                  }
                - {
                    type: object,
                    required: [action],
                    properties: { action: { const: sitting-attest } },
                    additionalProperties: true,
                  }
              discriminator: { propertyName: action }
      responses:
        "200":
          {
            description: Education action accepted,
            content:
              {
                application/json:
                  { schema: { type: object, additionalProperties: true } },
              },
          }
        default: { description: Unavailable or not authorized }

          },
          "canEdit": {
            "type": "boolean"
          },
          "createdAt": {
            "type": "string"
          }
        }
      },
      "CareerData": {
        "type": "object",
        "required": [
          "jobs",
          "candidates",
          "applications",
          "messages",
          "issues",
          "organizations",
          "ownProjects",
          "assignees",
          "profile",
          "projectTitle",
          "canManageProject",
          "canContribute",
          "hasMore",
          "offset"
        ],
        "properties": {
          "jobs": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CareerJob"
            }
          },
          "candidates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CareerCandidate"
            }
          },
          "applications": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CareerApplication"
            }
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CareerMessage"
            }
          },
          "issues": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CareerIssue"
            }
          },
          "organizations": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "name"
              ],
              "properties": {
                "id": {
                  "type": "string"
                },
                "name": {
                  "type": "string"
                }
              }
            }
          },
          "ownProjects": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CareerProof"
            }
          },
          "assignees": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "id",
                "displayName"
              ],
              "properties": {
                "id": {
                  "type": "string"
                },
                "displayName": {
                  "type": "string"
                }
              }
            }
          },
          "profile": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/CareerProfile"
              },
              {
                "type": "null"
              }
            ]
          },
          "projectTitle": {
            "type": "string"
          },
          "canManageProject": {
            "type": "boolean"
          },
          "canContribute": {
            "type": "boolean"
          },
          "hasMore": {
            "type": "boolean"
          },
          "offset": {
            "type": "integer"
          }
        }
      },

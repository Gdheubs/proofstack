          "headline": {
            "type": "string"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "availability": {
            "type": "string",
            "enum": [
              "open",
              "exploring",
              "closed"
            ]
          },
          "discoverable": {
            "type": "boolean"
          },
          "featuredProjects": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "CareerProof": {
        "type": "object",

# The API runs in Singapore, next to the Neon database (aws-ap-southeast-1).
# Every setting, secrets included, lives in the env group proofstack-api-env;
# change values there, not on the service. Secrets are never stored here.
services:
  - type: web
    name: proofstack-api-sg
    runtime: node
    plan: free
    region: singapore
    autoDeploy: false
    # Render's preinstalled pnpm is read-only and unpinned (corepack enable now
    # fails with EROFS), so the build runs the exact pnpm from packageManager.
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 --filter @workspace/api-server run build
    # Start without a package manager: same as the package's start script.
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - fromGroup: proofstack-api-env

# Expected keys in proofstack-api-env (values set in the Render dashboard):
# NODE_ENV=production, BIND_HOST=0.0.0.0, DATABASE_URL, DATABASE_POOL_MAX=5,
# AUTH_APP_ORIGIN, CORS_ALLOWED_ORIGINS, TRUST_PROXY_CIDRS, SUPABASE_URL,
# SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY, SESSION_SECRET,
# PROXY_SHARED_SECRET, PRIVATE_OBJECT_DIR, R2_ENDPOINT, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, SENTRY_DSN, SENTRY_BROWSER_DSN,
# SENTRY_ENVIRONMENT=production, GITHUB_OAUTH_CLIENT_ID,
# GITHUB_OAUTH_CLIENT_SECRET.

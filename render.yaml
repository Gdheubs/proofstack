services:
  - type: web
    name: proofstack-api
    runtime: node
    plan: free
    autoDeploy: false
    # Render's preinstalled pnpm is read-only and unpinned (corepack enable now
    # fails with EROFS), so the build runs the exact pnpm from packageManager.
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 --filter @workspace/api-server run build
    # Start without a package manager: same as the package's start script.
    startCommand: cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BIND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AUTH_APP_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_CIDRS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_BROWSER_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false

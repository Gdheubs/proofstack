packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  esbuild: true
  # Downloads the Cloudflare Workers runtime used by wrangler/OpenNext.
  workerd: true
  '@firebase/util': false
  protobufjs: false

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': 25.9.6
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  # GHSA-mrhx-c7xc-m3w5: patched in 4.6.6. Code written for v3 imports zod/v3.
  zod: 4.6.6

minimumReleaseAge: 1440


onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # GHSA-xjj6-f33q-929c and the EventSource DoS: undici under the Workers dev tooling.
  'miniflare>undici': 7.30.1
  # GHSA-27r3-jxmh-p828 (body-parser DoS), used by Express 5.
  body-parser: 2.4.0
  # GHSA-5j98-mcp5-4vw2 (glob CLI) affects 10.2.0-10.4.x; the build-time
  # minifier used by the Cloudflare adapter needs the v10 API.
  '@node-minify/core>glob': 10.5.0
  # Phase 7 security patches: GHSA-jqcg-44mw-7w3h and GHSA-68fv-2mgg-jv7q.
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  fast-uri: 3.1.9
  'brace-expansion@5': 5.0.12
  postcss-selector-parser: 7.1.6
  # Storage transport dependencies use only v4; 11.1.1 retains CommonJS support.
  "uuid@9.0.1": "11.1.1"
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  # Keep Firestore on its compatible branch while fixing both gRPC advisories.
  '@firebase/firestore>@grpc/grpc-js': 1.13.7
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-win32-x64': '-'
  esbuild: 0.28.2
  js-yaml: 4.3.2
  # GHSA-r7fv-28h4-cvq7 and GHSA-gfr2-rv44-r23c, dev-only via orval>typedoc.
  markdown-it: 14.3.3
  # GHSA-wq5f-xc86-pv6w (librsvg in sharp <0.35.5), dev-only via wrangler>miniflare.
  'miniflare>sharp': 0.35.5

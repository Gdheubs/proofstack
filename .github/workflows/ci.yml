name: ProofStack CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Isolated, disposable CI database. No production credentials or data.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: proofstack_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofstack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/proofstack_ci
      NODE_ENV: test
      PORT: 8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Bootstrap the package manager with the project's Node version.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the disposable CI database
        run: pnpm --filter @workspace/db run migrate:dev
      - name: Verify the migration runner can be safely rerun
        run: pnpm --filter @workspace/db run migrate:dev
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: node scripts/ci-check-generated.mjs
      - run: pnpm audit --audit-level moderate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:all
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/proofstack run build
        env:
          NODE_ENV: production
          API_INTERNAL_ORIGIN: http://127.0.0.1:8080
          NEXT_TELEMETRY_DISABLED: "1"

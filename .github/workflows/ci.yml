name: ProofStack CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Isolated, disposable CI database. No production credentials or data.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: proofstack_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proofstack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/proofstack_ci
      NODE_ENV: test
      PORT: 8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Bootstrap the package manager with the project's Node version.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the disposable CI database
        run: pnpm --filter @workspace/db run migrate:dev
      - name: Verify the migration runner can be safely rerun
        run: pnpm --filter @workspace/db run migrate:dev
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: node scripts/ci-check-generated.mjs
      - run: pnpm audit --audit-level moderate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:all
      - name: Install the PostgreSQL 17 client from the signed PGDG repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      # Exercises the production backup and restore scripts end to end against
      # the disposable CI database, with a throwaway passphrase.
      - name: Backup and restore drill
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          BACKUP_PASSPHRASE="$(openssl rand -base64 48)"
          export BACKUP_PASSPHRASE
          BACKUP_DATABASE_URL="$DATABASE_URL" \
            BACKUP_OUTPUT_DIR="$RUNNER_TEMP/backup" \
            bash scripts/backup-database.sh
          psql "$DATABASE_URL" -qc "CREATE DATABASE proofstack_restore"
          restore=postgresql://postgres@localhost:5432/proofstack_restore
          RESTORE_DATABASE_URL="$restore" \
            bash scripts/restore-database.sh "$RUNNER_TEMP"/backup/*.dump.gpg
          summary="SELECT (SELECT count(*) FROM pg_tables WHERE schemaname IN ('public','drizzle')),
            (SELECT count(*) FROM drizzle.__drizzle_migrations),
            (SELECT count(*) FROM public.users)"
          source_counts="$(psql "$DATABASE_URL" -Atqc "$summary")"
          restored_counts="$(psql "$restore" -Atqc "$summary")"
          echo "source=$source_counts restored=$restored_counts"
          test "$source_counts" = "$restored_counts"
          # A second restore into the now-populated database must be refused.
          if RESTORE_DATABASE_URL="$restore" \
            bash scripts/restore-database.sh "$RUNNER_TEMP"/backup/*.dump.gpg; then
            echo "Restore into a non-empty database was not refused" >&2
            exit 1
          fi
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/proofstack run build
        env:
          NODE_ENV: production
          API_INTERNAL_ORIGIN: http://127.0.0.1:8080
          NEXT_TELEMETRY_DISABLED: "1"

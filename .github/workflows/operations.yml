name: ProofStack Operations

# Scheduled maintenance against the deployed environment. Runs only on its
# schedule or a manual dispatch, never for pull requests or pushes. Credentials
# live in the protected "production" environment, are exposed only as step
# environment variables, and are never printed. Scheduled runs stay off until
# the repository variable OPERATIONS_ENABLED is "true"; manual runs always work.
on:
  schedule:
    # Image cleanup every 6 hours (keeps Actions minutes within the free tier).
    - cron: "17 */6 * * *"
    # Nightly database backup at 20:41 UTC (02:11 IST).
    - cron: "41 20 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task to run now
        type: choice
        options: [cleanup, backup]
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

jobs:
  asset-cleanup:
    if: (github.event.schedule == '17 */6 * * *' && vars.OPERATIONS_ENABLED == 'true') || inputs.task == 'cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile --filter @workspace/api-server...
      - run: pnpm --filter @workspace/api-server run build
      - name: Drain due image cleanup jobs
        env:
          ASSET_CLEANUP_ENABLED: "true"
          ASSET_CLEANUP_ALLOWED_NAMESPACES: ${{ vars.PRIVATE_OBJECT_DIR }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm --filter @workspace/api-server run worker:asset-cleanup:once

  database-backup:
    if: (github.event.schedule == '41 20 * * *' && vars.OPERATIONS_ENABLED == 'true') || inputs.task == 'backup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the PostgreSQL 17 client from the signed PGDG repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Back up the application database (Neon)
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          AWS_DEFAULT_REGION: auto
          BACKUP_SCHEMAS: public drizzle
          BACKUP_NAME: proofstack
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          bash scripts/backup-database.sh
      # Sign-in identities live in the Supabase Auth project, not in Neon.
      - name: Back up Supabase Auth identities
        if: vars.IDENTITY_BACKUP_ENABLED == 'true'
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          AWS_DEFAULT_REGION: auto
          BACKUP_SCHEMAS: auth
          BACKUP_REQUIRED_TABLES: auth.users auth.identities
          BACKUP_MIN_TABLES: "5"
          BACKUP_NAME: identity
          BACKUP_DATABASE_URL: ${{ secrets.IDENTITY_BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          bash scripts/backup-database.sh

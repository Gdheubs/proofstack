name: ProofStack Keep-alive

# Free Supabase projects pause after a week without activity, which takes
# sign-in down. Once a day this loads the site's sign-in check, which asks the
# identity provider for its settings exactly as a visitor's page load does.
# It needs no secrets. A failure here means sign-in is down: check the Supabase
# project (Restore if paused) and the API service.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://proofstack-web.suhailalam302.workers.dev' }}
    steps:
      - name: Load the sign-in check
        run: |
          # The API may be asleep; allow it a minute to wake, then retry once.
          for attempt in 1 2; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$SITE_URL/api/auth/context")
            echo "Attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Sign-in check failed (HTTP $status). Restore the Supabase project if it is paused."
          exit 1
